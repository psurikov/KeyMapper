version: 2.1

orbs:
  win: circleci/windows@5.0

jobs:
  build_and_test:
    executor: win/default
    steps:
      - checkout
      - run:
          name: Install .NET 10 SDK
          command: |
            choco install dotnet-sdk --version=10.0.100 -y
            refreshenv
      - run: dotnet restore KeyMapper.sln
      - run: dotnet build KeyMapper.sln --configuration Release --no-restore
      - run: dotnet test KeyMapper.Tests/KeyMapper.Tests.csproj --configuration Release --no-build --logger "trx"
      - store_test_results:
          path: KeyMapper.Tests/TestResults

workflows:
  version: 2
  build_and_test_workflow:
    jobs:
      - build_and_test